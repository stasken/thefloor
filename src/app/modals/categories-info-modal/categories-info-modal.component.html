<div id="category-info-container">
  <div *ngFor="let user of userCounts">
    <p [ngClass]="{'highlight': user.count === requiredCategoryCount, 'error': user.count > requiredCategoryCount}">
      {{ user.name }}: {{ user.count }} / {{ requiredCategoryCount }}
    </p>
  </div>
  <ion-button class="btn" (click)="goBack()">Go back</ion-button>
</div>
